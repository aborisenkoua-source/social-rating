<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>Социальный рейтинг</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-left">
      <button id="menu-day"      class="nav-btn is-active">День</button>
      <button id="menu-calendar" class="nav-btn">Календарь</button>
      <button id="menu-tasks"    class="nav-btn">Дела</button>
      <button id="menu-children" class="nav-btn">Дети</button>
      <button id="menu-scales"   class="nav-btn">Шкалы</button>
    </div>
    <div class="appbar-right">
      <span id="sync-status" class="sync-status" title="Статус синхронизации"></span>
      <button id="btn-export" class="icon-btn" title="Экспорт данных">⬇ Экспорт</button>
      <button id="btn-import" class="icon-btn" title="Импорт данных">⬆ Импорт</button>
      <input id="file-import" type="file" accept="application/json" hidden />
      <button id="btn-logout" class="icon-btn hidden" title="Выйти">Выйти</button>
    </div>
  </header>

  <!-- Экран входа -->
  <div id="login-screen" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-text">Вход в «Социальный рейтинг»</div>
      <label class="field">
        <span>Email</span>
        <input id="login-email" type="email" autocomplete="username" />
      </label>
      <label class="field">
        <span>Пароль</span>
        <input id="login-password" type="password" autocomplete="current-password" />
      </label>
      <div id="login-error" class="notice hidden" style="color: var(--danger);"></div>
      <div class="modal-actions">
        <button id="login-ok" class="btn btn-primary">Войти</button>
      </div>
    </div>
  </div>

  <main id="screen"></main>

  <!-- Диалог подтверждения -->
  <div id="confirm" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="confirm-text" class="modal-text"></div>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn">Отмена</button>
        <button id="confirm-ok" class="btn btn-danger">OK</button>
      </div>
    </div>
  </div>

  <!-- Простой промпт (для ввода имени/баллов) -->
  <div id="prompt" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="prompt-label" class="modal-text"></div>
      <input id="prompt-input" type="text" class="modal-input" />
      <div class="modal-actions">
        <button id="prompt-cancel" class="btn">Отмена</button>
        <button id="prompt-ok" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <!-- Форма «своё дело» -->
  <div id="custom" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-text">Добавить запись</div>
      <label class="field">
        <span>Что сделано</span>
        <input id="custom-name" type="text" placeholder="Например: помог на даче" />
      </label>
      <label class="field">
        <span>Баллы (+/−)</span>
        <input id="custom-points" type="number" step="1" value="1" />
      </label>
      <label class="field field-row">
        <input id="custom-save" type="checkbox" />
        <span>Сохранить в справочник</span>
      </label>
      <div class="modal-actions">
        <button id="custom-cancel" class="btn">Отмена</button>
        <button id="custom-ok" class="btn btn-primary">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Редактирование записи -->
  <div id="edit" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-text">Редактировать запись</div>
      <label class="field">
        <span>Название</span>
        <input id="edit-name" type="text" />
      </label>
      <label class="field">
        <span>Баллы (+/−)</span>
        <input id="edit-points" type="number" step="1" />
      </label>
      <div class="modal-actions">
        <button id="edit-cancel" class="btn">Отмена</button>
        <button id="edit-ok" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shared-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
